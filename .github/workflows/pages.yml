name: Release & Deploy

on:
  push:
    branches: ["master"]

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write


concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  version-bump:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Authenticate as rnagy95/version-bump-bot
        uses: actions/create-github-app-token@v2
        id: auth
        with:
          app-id: ${{ secrets.VERSION_BUMP_BOT_ID }}
          private-key: ${{ secrets.VERSION_BUMP_BOT_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.auth.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          
      - name: Configure Git
        run: |
          git config --global user.name '${{ steps.auth.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.auth.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Read bump type
        id: bump_type
        run: echo "type=$(cat .bump-type)" >> $GITHUB_OUTPUT

      - name: Bump version
        id: bump
        run: |
          new_tag=$(npm version ${{ steps.bump_type.outputs.type }})
          echo "new_tag=$new_tag" >> $GITHUB_OUTPUT

      - name: Push commit and tag
        run: git push --follow-tags

      - name: Create Pull Request to develop
        run: gh pr create -B master -H develop --title 'Merge master into develop' --body 'Created by Release & Deploy Action'

      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.bump.outputs.new_tag }}" \
          --title "Release ${{ steps.bump.outputs.new_tag }}" \
          --notes "Created by Release & Deploy Action"

  build:
    runs-on: ubuntu-latest
    needs: version-bump

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.JS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build Angular App
        run: |
          cd webApp
          npm ci
          npm run test --if-present
          npm run build --if-present

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
